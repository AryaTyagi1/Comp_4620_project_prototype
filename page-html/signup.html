<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SpaceScout</title>

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Our CSS -->
    <link rel="stylesheet" href="../pages-css-sheet/styles.css">
    <link rel="stylesheet" href="../pages-css-sheet/login.css">
</head>
<body>
    <!-- BLURRED BACKGROUND -->
    <div class="background-image"></div>

    <div class="login-container">

        <a href="index.html" class="home-icon" title="Go to Home">
        <i class="fa-solid fa-arrow-left"></i>
        <span class="home-text">Home</span>
        </a>
        <div class="logo">
            <div class="logo-text">
                <span class="brand-name"><span class="brand-space">SPACE</span><span class="brand-finder">SCOUT</span></span>
                <hr class="logo-divider">
                <span class="brand-tag">UManitoba Public Space Info</span>
            </div>
        </div>
        <p class="login-title">Welcome to SpaceScout</p>

        <form class="login-form">
            <input type="email" class="login-input" placeholder="Email" required>
            <input type="password" class="login-input" placeholder="Password" required>
            <button type="submit" class="login-btn"><a href="index.html">Signup</a></button>
        </form>

        <p class="login-footer">
            Already have an account? <a href="login.html">Login</a>
        </p>
    </div>
</body>

</html>
