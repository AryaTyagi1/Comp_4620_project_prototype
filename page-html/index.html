<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Space Information Center</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">

    <!-- Mapbox GL JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>

    <!-- Our CSS -->
    <link rel="stylesheet" href="../pages-css-sheet/styles.css">
    <link rel="stylesheet" href="../pages-css-sheet/shared-nav-about.css">
</head>
<body>

    <!-- TOP NAVIGATION -->
    <header>
        <!-- Left Group: Logo -->
        <div class="header-left-group">
            <div class="logo">
                <div class="logo-text">
                    <span class="brand-name"><span class="brand-space">SPACE</span><span class="brand-finder">SCOUT</span></span>
                    <hr class="logo-divider">
                    <span class="brand-tag">UManitoba Public Space Info</span>
                </div>
            </div>
        </div>

        <!-- Center Navigation -->
        <nav>
            <a href="#" class="nav-link">Spaces</a>
            <span class="nav-separator">|</span>
            <a href="#" class="nav-link">Saved</a>
            <span class="nav-separator">|</span>
            <a href="#" class="nav-link">Report A Space</a>
            <span class="nav-separator">|</span>
            <a href="#" class="nav-link">About</a>
        </nav>

        <!-- Right Group: Login Button -->
        <div class="header-right-group">
            <button class="login-btn" type="button" aria-label="Login" onclick="window.location.href='login.html'">
                <img src="../assets/orange-profile-icon.jpg" alt="Login" class="login-icon-img">
            </button>
        </div>
    </header>

    <!-- FULL-BACKGROUND 3D MAPBOX CONTAINER -->
    <div id="map"></div>

    <!-- MAIN CONTENT AREA -->
    <main>
        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">
            <!-- SOLID WHITE FILTER CARD (UNCHANGED) -->
            <div class="controls">
                <!-- Top Row: Search Left | Divider | Filter Right -->
                <div class="controls-top-row">
                    <div class="search-bar">
                        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        <div class="search-divider"></div>
                        <input type="text" id="search-input" placeholder="Search a space...">
                    </div>

                    <span class="controls-divider">|</span>

                    <button class="filter-trigger-btn" id="btn-open-filter-modal" type="button">
                        <img src="../assets/filter_search_bar.png" alt="" class="filter-icon">
                        <span>Filters</span>
                        <span class="filter-count-badge" id="filter-count-badge" hidden>0</span>
                    </button>
                </div>

                <!-- Subtle Horizontal Divider -->
                <hr class="horizontal-divider">

                <!-- Bottom Row: Recommendations Section -->
                <div class="recommendations-section">
                    <span class="recommendations-title">Recommendations</span>
                    <div class="recommendations-scroll-container">
                        <button class="quick-chip" data-quick="nearest" type="button">Nearest to you</button>
                        <button class="quick-chip" data-quick="quiet" type="button">Quietest space</button>
                        <button class="quick-chip" data-quick="free" type="button">Freest availability</button>
                    </div>
                </div>
            </div>

            <!-- TRANSPARENT SPACE CARDS LIST -->
            <div class="space-list" id="space-list">
                <!-- JS will inject list items here -->
            </div>
        </aside>

        <!-- RIGHT MAP HUD AREA -->
        <section class="map-area" id="map-area">

            <!-- FILTER DRAWER (slides in from the left, over the map) -->
            <div class="filter-drawer" id="filter-drawer" role="dialog" aria-labelledby="filter-drawer-title" aria-hidden="true">
                <div class="filter-drawer-header">
                    <h3 id="filter-drawer-title">Filters</h3>
                    <div class="filter-drawer-header-actions">
                        <button type="button" class="filter-reset-btn" id="filter-reset-btn">Reset</button>
                        <button type="button" class="filter-close-btn" id="filter-close-btn" aria-label="Close filters">×</button>
                    </div>
                </div>

                <div class="filter-drawer-body">
                    <!-- Sort -->
                    <section class="filter-group">
                        <span class="filter-label">Sort by</span>
                        <div class="filter-chip-row" data-filter="sort" data-required="true">
                            <button type="button" class="filter-chip" data-value="distance">Nearest</button>
                            <button type="button" class="filter-chip" data-value="quiet">Quietest</button>
                            <button type="button" class="filter-chip" data-value="available">Most available</button>
                            <button type="button" class="filter-chip" data-value="rating">Top rated</button>
                        </div>
                    </section>

                    <hr class="filter-divider">

                    <!-- Solo / Group -->
                    <section class="filter-group">
                        <span class="filter-label">What are you doing?</span>
                        <div class="filter-segmented" data-filter="mode" data-required="true">
                            <button type="button" class="filter-segment" data-value="solo">Solo</button>
                            <button type="button" class="filter-segment" data-value="group">Group</button>
                        </div>
                    </section>

                    <!-- Group size (only when Group is picked) -->
                    <section class="filter-group" id="group-size-group" hidden>
                        <span class="filter-label">Group size</span>
                        <div class="filter-stepper">
                            <span id="group-size-value">4 people</span>
                            <div class="filter-stepper-btns">
                                <button type="button" id="group-size-minus" aria-label="Fewer people">−</button>
                                <button type="button" id="group-size-plus" aria-label="More people">+</button>
                            </div>
                        </div>
                    </section>

                    <!-- Study length -->
                    <section class="filter-group">
                        <span class="filter-label">How long do you plan to study?</span>
                        <div class="filter-chip-row" data-filter="duration">
                            <button type="button" class="filter-chip" data-value="short">&lt; 1h</button>
                            <button type="button" class="filter-chip" data-value="medium">1–2h</button>
                            <button type="button" class="filter-chip" data-value="long">2h+</button>
                        </div>
                    </section>

                    <!-- Noise -->
                    <section class="filter-group">
                        <span class="filter-label">Noise level</span>
                        <div class="filter-chip-row" data-filter="noise">
                            <button type="button" class="filter-chip" data-value="silent">Silent</button>
                            <button type="button" class="filter-chip" data-value="quiet">Quiet</button>
                            <button type="button" class="filter-chip" data-value="talking">Talking OK</button>
                        </div>
                    </section>

                    <!-- Distance -->
                    <section class="filter-group">
                        <span class="filter-label">Distance</span>
                        <div class="filter-chip-row" data-filter="distance" data-required="true">
                            <button type="button" class="filter-chip" data-value="2">2 mins</button>
                            <button type="button" class="filter-chip" data-value="5">5 mins</button>
                            <button type="button" class="filter-chip" data-value="10">10 mins</button>
                            <button type="button" class="filter-chip" data-value="any">Any</button>
                        </div>
                    </section>

                    <hr class="filter-divider">

                    <!-- Toggles -->
                    <label class="filter-toggle-row">
                        <span class="filter-label">Need an outlet?</span>
                        <span class="filter-switch">
                            <input type="checkbox" id="filter-outlet">
                            <span class="filter-switch-slider"></span>
                        </span>
                    </label>

                    <label class="filter-toggle-row">
                        <span class="filter-label">Bookable?</span>
                        <span class="filter-switch">
                            <input type="checkbox" id="filter-bookable">
                            <span class="filter-switch-slider"></span>
                        </span>
                    </label>
                </div>

                <div class="filter-drawer-footer">
                    <button type="button" class="filter-apply-btn" id="filter-apply-btn">Show 4 spaces</button>
                </div>
            </div>

            <div class="selected-space-header">
                <h2 id="selected-title">Eckhardt-Gramatté Music Library</h2>
                <div class="header-sub-row">
                    <div class="header-info-left">
                        <span id="selected-distance">2 mins away</span>
                        <span class="header-divider-line">|</span>
                        <span id="selected-status-text">Busy</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="../pages-js/shared-nav-about.js"></script>
    <script src="../token-Admin/config.js"></script>
    <script src="../pages-js/script.js"></script>
</body>
</html>
